<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recall details | RecallGuard</title>
    <link rel="icon" type="image/png" href="/assets/recallguard-mark.png" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components/navigation.css" />
    <link rel="stylesheet" href="/css/recalls.css" />
    <script type="module" src="/js/recall-detail.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="RecallGuard home"
        ><img
          src="/assets/recallguard-mark.png"
          alt=""
          width="28"
          height="28"
        /><span>RecallGuard</span></a
      >
      <nav aria-label="Main navigation">
        <ul class="tabs">
          <li><a href="/products.html">My Products</a></li>
          <li>
            <a href="/recalls.html" aria-current="page">Recall Explorer</a>
          </li>
          <li><a href="/watchlist.html">My Watchlist</a></li>
        </ul>
      </nav>
    </header>
    <main class="page-content detail-page">
      <a id="back-link" class="back-link" href="/recalls.html"
        >← Back to recalls</a
      >
      <p id="detail-status" role="status">Loading recall…</p>
      <article id="recall-detail" hidden>
        <div class="detail-heading">
          <p class="detail-source">
            <img id="detail-flag" alt="" /><span id="detail-source-name"></span>
          </p>
          <h1 id="detail-title" tabindex="-1"></h1>
          <div class="detail-dates">
            <p>Recall date <span id="recall-date"></span></p>
            <p>Last updated <span id="updated-date"></span></p>
            <p id="archived-label" hidden>Archived notice</p>
          </div>
          <a
            id="source-link"
            class="solid-button"
            target="_blank"
            rel="noopener noreferrer"
            >Read the official notice ↗</a
          >
        </div>
        <div class="detail-layout">
          <div id="detail-sections"></div>
          <aside class="product-facts" aria-labelledby="facts-title">
            <h2 id="facts-title">Product information</h2>
            <dl id="product-facts"></dl>
          </aside>
        </div>
        <section id="image-section" class="detail-section" hidden>
          <h2>Product images</h2>
          <div id="product-images" class="product-images"></div>
        </section>
      </article>
      <noscript><p>Enable JavaScript to read this recall.</p></noscript>
    </main>
    <footer class="site-footer">
      <p>
        Sheng, Tian · CS5610 Project 2 ·
        <span class="footer-university"
          ><span class="university-seal" aria-hidden="true"
            ><img
              src="/assets/northeastern-seal.png"
              alt=""
              width="1024"
              height="595" /></span
          >Northeastern University</span
        >
      </p>
    </footer>
  </body>
</html>
