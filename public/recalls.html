<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recall Explorer | RecallGuard</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components/navigation.css" />
    <link rel="stylesheet" href="/css/recalls.css" />
    <script type="module" src="/js/explorer.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="RecallGuard home">
        <img src="/assets/recallguard-mark.png" alt="" width="28" height="28" />
        <span>RecallGuard</span>
      </a>
      <nav aria-label="Main navigation">
        <ul class="tabs">
          <li><a href="/">My Products</a></li>
          <li>
            <a href="/recalls.html" aria-current="page">Recall Explorer</a>
          </li>
          <li><a href="/watchlist.html">My Watchlist</a></li>
        </ul>
      </nav>
    </header>
    <main class="explorer page-content">
      <form
        id="filters"
        class="filters"
        role="search"
        aria-label="Filter recall records"
        novalidate
      >
        <div class="filter-top">
          <fieldset class="country-filter">
            <legend>Country</legend>
            <div class="country-options">
              <label
                ><input type="radio" name="country" value="" checked /><span
                  >All</span
                ></label
              >
              <label
                ><input type="radio" name="country" value="US" /><span
                  ><img src="/assets/flag-us.svg" alt="" />United States</span
                ></label
              >
              <label
                ><input type="radio" name="country" value="CA" /><span
                  ><img src="/assets/flag-ca.svg" alt="" />Canada</span
                ></label
              >
            </div>
          </fieldset>
          <div class="search-field">
            <label for="search">Search</label>
            <div class="search-control">
              <label id="risk-label" for="risk-trigger" class="sr-only"
                >Risk</label
              >
              <div class="dropdown search-risk" data-dropdown="risk">
                <select id="risk" name="risk" hidden>
                  <option value="">All risks</option>
                </select>
                <button
                  id="risk-trigger"
                  type="button"
                  class="dropdown-trigger"
                  role="combobox"
                  aria-labelledby="risk-label risk-value"
                  aria-controls="risk-options"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                >
                  <span id="risk-value">All risks</span>
                </button>
                <div
                  id="risk-options"
                  class="dropdown-menu"
                  role="listbox"
                  aria-labelledby="risk-label"
                  hidden
                ></div>
              </div>
              <input
                id="search"
                name="q"
                type="search"
                placeholder="Product, brand or keyword"
                maxlength="120"
                autocomplete="off"
              />
              <button type="submit">Search</button>
            </div>
          </div>
        </div>
        <div class="filter-actions">
          <button
            id="more-filters"
            class="more-filters"
            type="button"
            aria-controls="advanced-filters"
            aria-expanded="false"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path d="M3 6h18M3 12h18M3 18h18M8 3v6M16 9v6M10 15v6" />
            </svg>
            <span>More filters</span><span id="advanced-count" hidden></span>
            <svg
              class="filter-chevron"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path d="m4 6 4 4 4-4" />
            </svg>
          </button>
          <button type="reset" class="text-button reset-button">
            Clear filters
          </button>
        </div>
        <div
          id="advanced-filters"
          class="filter-bottom advanced-filters"
          hidden
        >
          <div class="filter-field category-field">
            <label for="category">Category</label>
            <div class="dropdown" data-dropdown="category">
              <input
                id="category"
                name="category"
                type="search"
                role="combobox"
                aria-autocomplete="list"
                aria-controls="category-options"
                aria-expanded="false"
                placeholder="All categories"
                maxlength="160"
                autocomplete="off"
              />
              <button
                type="button"
                class="dropdown-toggle"
                aria-label="Show categories"
                tabindex="-1"
              ></button>
              <div
                id="category-options"
                class="dropdown-menu"
                role="listbox"
                aria-label="Categories"
                hidden
              ></div>
            </div>
          </div>
          <fieldset class="updated-range">
            <legend>Updated range</legend>
            <div class="date-range-controls">
              <label class="sr-only" for="updated-from">Updated from</label>
              <input
                type="date"
                id="updated-from"
                name="updatedFrom"
                min="0001-01-01"
                max="9999-12-31"
                aria-label="Updated from"
              />
              <span class="date-separator" aria-hidden="true">to</span>
              <label class="sr-only" for="updated-to">Updated to</label>
              <input
                type="date"
                id="updated-to"
                name="updatedTo"
                min="0001-01-01"
                max="9999-12-31"
                aria-label="Updated to"
              />
            </div>
          </fieldset>
        </div>
        <input id="sort" name="sort" type="hidden" value="latest" />
      </form>

      <section id="results" aria-label="Recall results" aria-busy="true">
        <div class="results-heading">
          <p id="result-count" role="status">Loading recalls…</p>
          <button
            id="sort-toggle"
            class="sort-toggle"
            type="button"
            data-order="latest"
            aria-label="Newest updates first. Switch to oldest first."
          >
            <span id="sort-value">Newest</span>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path d="M6 4v16m-4-4 4 4 4-4M13 5h9M13 10h7M13 15h5M13 20h3" />
            </svg>
          </button>
        </div>
        <div class="table-container">
          <table class="recall-table">
            <caption class="sr-only">
              Product recalls. Follow a recall name to read the full notice.
            </caption>
            <colgroup>
              <col class="recall-col" />
              <col class="country-col" />
              <col class="category-col" />
              <col class="risk-col" />
              <col class="date-col" />
              <col class="arrow-col" />
            </colgroup>
            <thead>
              <tr>
                <th scope="col">Recall</th>
                <th scope="col">
                  <span class="desktop-country-heading">Country</span
                  ><span class="mobile-country-heading">From</span>
                </th>
                <th scope="col" class="category-cell">Category</th>
                <th scope="col">Risk</th>
                <th scope="col" class="date-cell">Updated</th>
                <th scope="col" class="arrow-cell">
                  <span class="sr-only">Details</span>
                </th>
              </tr>
            </thead>
            <tbody id="recall-rows"></tbody>
          </table>
        </div>
        <div id="list-message" class="list-message" hidden>
          <h2 id="message-title"></h2>
          <p id="message-description"></p>
          <button id="retry" type="button" class="outline-button" hidden>
            Try again
          </button>
        </div>
        <nav class="pagination" aria-label="Recall result pages">
          <p id="page-summary"></p>
          <div class="page-controls">
            <button id="previous" type="button" class="outline-button" disabled>
              ← Previous</button
            ><span id="page-number"></span
            ><button id="next" type="button" class="outline-button" disabled>
              Next →
            </button>
          </div>
        </nav>
      </section>
      <noscript
        ><p>Enable JavaScript to browse the recall records.</p></noscript
      >
    </main>
    <footer class="site-footer">
      <p>
        Sheng, Tian · CS5610 Project 2 ·
        <span class="footer-university"
          ><span class="university-seal" aria-hidden="true"
            ><img
              src="/assets/northeastern-seal.png"
              alt=""
              width="1024"
              height="595" /></span
          >Northeastern University</span
        >
      </p>
    </footer>
    <template id="row-template">
      <tr>
        <td class="recall-cell">
          <a class="recall-link"></a><span class="recall-subtitle"></span
          ><span class="mobile-meta"></span>
        </td>
        <td class="country-cell">
          <span class="country-label"><img alt="" /><span></span></span>
        </td>
        <td class="category-cell"></td>
        <td class="risk-cell"></td>
        <td class="date-cell"></td>
        <td class="arrow-cell" aria-hidden="true">↗</td>
      </tr>
    </template>
  </body>
</html>
